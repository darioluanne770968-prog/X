[project]
name = "x-daily-digest"
version = "0.1.0"
description = "每日 X/Twitter 摘要 Bot - 自动抓取推文并生成 AI 摘要"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tweepy>=4.14.0",
    "openai>=1.0.0",
    "python-telegram-bot>=20.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
x-digest = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
