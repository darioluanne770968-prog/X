{% extends "base.html" %}

{% block title %}{{ filename }} - X Daily Digest{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold">📄 {{ filename }}</h1>
        <a href="/exports" class="text-x-blue hover:underline">← 返回列表</a>
    </div>

    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
        <div class="markdown-content bg-gray-900 rounded p-4 overflow-auto whitespace-pre-wrap text-sm max-h-[70vh]">
{{ content }}
        </div>
    </div>
</div>
{% endblock %}
