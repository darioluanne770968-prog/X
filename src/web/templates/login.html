<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - X Daily Digest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'x-blue': '#1DA1F2',
                        'x-dark': '#15202B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">📰</div>
            <h1 class="text-2xl font-bold text-white">X Daily Digest</h1>
            <p class="text-gray-400 mt-2">告别无限刷推，每天只看精华</p>
        </div>

        <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
            <h2 class="text-xl font-bold text-white mb-6">登录</h2>

            {% if error %}
            <div class="bg-red-900/50 border border-red-700 text-red-300 px-4 py-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-4">
                    <label for="username" class="block text-gray-300 text-sm font-medium mb-2">用户名</label>
                    <input type="text" id="username" name="username" required
                           class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-x-blue"
                           placeholder="输入用户名">
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-gray-300 text-sm font-medium mb-2">密码</label>
                    <input type="password" id="password" name="password" required
                           class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-x-blue"
                           placeholder="输入密码">
                </div>

                <button type="submit"
                        class="w-full bg-x-blue hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition">
                    登录
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/register" class="text-x-blue hover:text-blue-400 text-sm">
                    没有账号？立即注册
                </a>
            </div>
        </div>

        <div class="mt-6 text-center text-gray-500 text-sm">
            默认账号: admin / admin123
        </div>
    </div>
</body>
</html>
