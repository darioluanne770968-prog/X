<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}X Daily Digest{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'x-blue': '#1DA1F2',
                        'x-dark': '#15202B',
                        'x-gray': '#8899A6',
                    }
                }
            }
        }
    </script>
    <style>
        .markdown-content h1 { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; }
        .markdown-content h2 { font-size: 1.25rem; font-weight: bold; margin: 0.75rem 0; color: #1DA1F2; }
        .markdown-content h3 { font-size: 1.1rem; font-weight: 600; margin: 0.5rem 0; }
        .markdown-content p { margin: 0.5rem 0; }
        .markdown-content ul { list-style: disc; margin-left: 1.5rem; }
        .markdown-content a { color: #1DA1F2; text-decoration: underline; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-x-dark border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-x-blue">📰 X Daily Digest</a>
                    <div class="flex space-x-4">
                        <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if page == 'dashboard' %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700{% endif %}">
                            仪表盘
                        </a>
                        <a href="/following" class="px-3 py-2 rounded-md text-sm font-medium {% if page == 'following' %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700{% endif %}">
                            关注管理
                        </a>
                        <a href="/filter" class="px-3 py-2 rounded-md text-sm font-medium {% if page == 'filter' %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700{% endif %}">
                            过滤器
                        </a>
                        <a href="/exports" class="px-3 py-2 rounded-md text-sm font-medium {% if page == 'exports' %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700{% endif %}">
                            导出文件
                        </a>
                        <a href="/recommend" class="px-3 py-2 rounded-md text-sm font-medium {% if page == 'recommend' %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700{% endif %}">
                            账号推荐
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 任务状态提示 -->
    {% if current_task %}
    <div class="bg-blue-900 border-b border-blue-700">
        <div class="max-w-7xl mx-auto px-4 py-2 flex items-center">
            <svg class="animate-spin h-5 w-5 mr-3 text-blue-400" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-blue-200">{{ current_task }}</span>
        </div>
    </div>
    {% endif %}

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="bg-x-dark border-t border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-4 text-center text-gray-500 text-sm">
            X Daily Digest - 告别无限刷推，每天只看精华
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
